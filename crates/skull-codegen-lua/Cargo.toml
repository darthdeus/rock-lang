[package]
name = "skull-codegen-lua"
version = "0.1.0"
edition = "2024"

# skull-codegen-lua: the dumb Lua printer over skull-mir's typed cell-model CFG.
# Goto + labels (luajit has real `goto`), liveness-based local naming later. The
# printer never dispatches on operand types (the IR is already typed -- D8/P3);
# it depends on `bone` ONLY to resolve a `Call`'s `FuncRef` to its `Function`
# (mangling + extern/inline-lua emission shape -- bone-mir-design lines 160-164),
# never to look up an operand's type.

[dependencies]
comfy-la-arena = { workspace = true }
rustc-hash = { workspace = true }
skull-mir = { workspace = true }
bone-semantic = { workspace = true }
ustr = { workspace = true }
log = { workspace = true }

[dev-dependencies]
ustr = { workspace = true }
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
skull-graph = { workspace = true }
skull-parser = { workspace = true }
skull-transform = { workspace = true }

[lints]
workspace = true
