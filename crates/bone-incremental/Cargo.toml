[package]
autotests = false
name = "bone-incremental"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "Incremental sessions, dependency invalidation and differential fixtures"

# No unit tests or doctests in src/; skip the empty test harness.
[lib]
test = false
doctest = false

[dependencies]
bone-core = { workspace = true }
rock-core = { workspace = true }
bone-semantic = { workspace = true }
skull-parser = { workspace = true }

rustc-hash = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
# Real-project tests only: graph discovery (rock-host) and the alias tables
# (bone-query) the session needs for v1 `use` paths. The bone-query edge is a
# dev-only cycle (bone-query depends on bone-incremental), which Cargo permits.
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
bone-query = { path = "../bone-query" }

[lints]
workspace = true

[[test]]
name = "bone_incremental_tests"
path = "tests/main.rs"
