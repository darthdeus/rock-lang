[package]
name = "skull-fmt"
version = "0.1.0"
edition = "2024"
publish = false
description = "Formatter (rock fmt) and its tests/fmt corpus"
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
rock-core = { path = "../rock-core" }
rock-tokenizer = { path = "../rock-tokenizer" }
skull-parser = { path = "../skull-parser" }
ustr = { workspace = true }

# No unit tests; skip the empty test harness.
[[bin]]
name = "skullfmt"
path = "src/bin/skullfmt.rs"
test = false

[[test]]
name = "skull_fmt_tests"
path = "tests/main.rs"
