[package]
name = "skull-transform"
version = "0.1.0"
edition = "2024"

# skull-transform: CFG->CFG passes over skull-mir's cell IR. The coroutine pass
# (`co fn` -> stackless state machine) lives here, separated from the IR + the
# dumb printers (bone-mir-faithful plan crate split). Deps: skull-mir (IR),
# skull-codegen-lua (emit the transformed step + the constructor).

[dependencies]
rustc-hash = { workspace = true }
comfy-la-arena = { workspace = true }
skull-mir = { workspace = true }
skull-codegen-lua = { workspace = true }
bone-semantic = { workspace = true }
ustr = { workspace = true }
log = { workspace = true }

[dev-dependencies]
skull-parser = { workspace = true }
skull-graph = { workspace = true }

[lints]
workspace = true
