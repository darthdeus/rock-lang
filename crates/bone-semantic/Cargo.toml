[package]
name = "bone-semantic"
version = "0.1.0"
edition = "2024"
publish = false
description = "Semantic passes, identity-storage validation and typechecker fixtures"
license.workspace = true
repository.workspace = true
autotests = false

[features]
sequential = ["bone-core/sequential"]

[dependencies]
ustr = { workspace = true }
rust-lapper = { workspace = true }
tracing = { workspace = true }

bone-core = { path = "../bone-core" }
bone-lower = { path = "../bone-lower" }
bone-inference = { path = "../bone-inference" }
skull-parser = { path = "../skull-parser" }
rock-core = { path = "../rock-core" }

test-utils = { path = "../test-utils" }

[dev-dependencies]
datatest-stable = "0.3"
rock-stdlib = { path = "../rock-stdlib" }

[[test]]
name = "bone_semantic_tests"
path = "tests/main.rs"

# datatest-stable supplies its own main, so the fixture suite stays separate.
[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
harness = false

[lints]
workspace = true
