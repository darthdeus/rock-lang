[package]
name = "bone-semantic"
version = "0.1.0"
edition = "2024"
publish = false
description = "Semantic passes, identity-storage validation and typechecker fixtures"
license.workspace = true
repository.workspace = true
autotests = false

[features]
sequential = ["bone-core/sequential"]

[dependencies]
ustr = { workspace = true }
rust-lapper = { workspace = true }
tracing = { workspace = true }

bone-core = { path = "../bone-core" }
bone-lower = { path = "../bone-lower" }
bone-inference = { path = "../bone-inference" }
skull-parser = { path = "../skull-parser" }
rock-core = { path = "../rock-core" }

[dev-dependencies]
rock-stdlib = { path = "../rock-stdlib" }
test-utils = { path = "../test-utils" }

[[test]]
name = "bone_semantic_tests"
path = "tests/main.rs"

# One test per fixture file, from its own small harness in tests/fixture_harness.rs.
[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
harness = false

[lints]
workspace = true
