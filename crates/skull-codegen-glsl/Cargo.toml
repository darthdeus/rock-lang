[package]
name = "skull-codegen-glsl"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# skull-codegen-glsl: the Rock->GLSL emitter .
# A second codegen backend over the shared skull-mir substrate (the sibling of
# skull-codegen-lua). Given a typechecked workspace + a set of root fn names, it
# emits GLSL function definitions for the roots + their reachable callees,
# topologically ordered. Value structs stay first-class vecN (the values-first-class
# ScalarCtx flag); a strict profile pass rejects everything above tier 0.

[dependencies]
comfy-la-arena = { workspace = true }
rustc-hash = { workspace = true }
skull-mir = { workspace = true }
skull-graph = { workspace = true }
skull-codegen-lua = { workspace = true }
skull-codegen-shader = { workspace = true }
bone-semantic = { workspace = true }
skull-parser = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
rock-stdlib = { workspace = true }

[lints]
workspace = true
