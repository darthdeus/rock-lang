[package]
name = "stone-glsl-runner"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

# No unit tests or doctests in src/; skip the empty test harnesses.
[lib]
test = false
doctest = false

[[bin]]
name = "stone-glsl-runner"
path = "src/main.rs"
test = false

[dependencies]
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
glow = "0.17"
serde_json = { workspace = true }

[lints]
workspace = true
