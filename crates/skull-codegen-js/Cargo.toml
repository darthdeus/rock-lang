[package]
name = "skull-codegen-js"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "JavaScript emission and runtime prelude for Rock programs"
autotests = false

# A structured MIR->JS emitter plus the JS runtime blocks an emitted program
# needs. Tests run the output under node (and, for the differentials, luajit)
# from PATH.

[dependencies]
skull-mir = { workspace = true }
skull-graph = { workspace = true }
rustc-hash = { workspace = true }
skull-transform = { workspace = true }
bone-core = { workspace = true }
skull-parser = { workspace = true }
comfy-la-arena = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
bone-semantic = { workspace = true }
rock-stdlib = { workspace = true }
skull = { workspace = true }
skull-parser = { workspace = true }
ustr = { workspace = true }

[lints]
workspace = true

[[test]]
name = "js_tests"
path = "tests/main.rs"
