[package]
name = "skull-codegen-js"
version = "0.1.0"
edition = "2024"
autotests = false

# skull-codegen-js: the conformance-differential JS backend (docs/backends.md).
# A structured MIR->JS emitter for the scalar + NativeBuffer subset, run under
# node as the second executing backend: mapping-vs-fallback for the scalar
# intrinsics, JS-native vs luajit-native for the @native_required NativeBuffer
# surface (tests/nb_differential.rs). Not a deployment target (that is S5).

[dependencies]
skull-mir = { path = "../skull-mir" }
skull-graph = { path = "../skull-graph" }
rustc-hash = { workspace = true }
skull-transform = { path = "../skull-transform" }
bone-semantic = { path = "../bone-semantic" }
skull-parser = { path = "../skull-parser" }
comfy-la-arena = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
rock-host = { path = "../rock-host" }
skull = { path = "../skull" }
skull-parser = { path = "../skull-parser" }
ustr = { workspace = true }

[lints]
workspace = true

[[test]]
name = "js_tests"
path = "tests/main.rs"
