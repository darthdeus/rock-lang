[package]
name = "rock-cli"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
path = "src/lib.rs"

[features]
# Swap bone's parallel passes for sequential std-iterator equivalents
# (the prelude shim in bone/src/prelude.rs), for clean
# single-threaded sampling profiles with no rayon plumbing frames. rock-cli is a
# workspace default-member; rock-dev-cli forwards `--features sequential`
# here and this propagates it to bone. It also flips rock-semantic's source loading
# to serial, so a front-end profile (rock iter-parse / iter-tokenize) has no
# rayon pool/teardown frames either. See `just samply-bone-seq`.
sequential = ["bone-semantic/sequential", "skull/sequential", "bone-query/sequential"]
renderer-wgpu = ["skull/renderer-wgpu"]

[dependencies]
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
rock-log = { workspace = true }
rock-core = { workspace = true }
rock-tokenizer = { workspace = true }
skull-fmt = { workspace = true }
skull-parser = { workspace = true }
bone-semantic = { workspace = true }
bone-core = { workspace = true }
bone-lints = { workspace = true }
bone-incremental = { workspace = true }
bone-query = { workspace = true }
skull = { workspace = true }
skull-codegen-glsl = { workspace = true }
skull-mir = { workspace = true }
lsp-types = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
basic-toml = "0.1"
fs-err = { workspace = true }
walkdir = { workspace = true }
tempfile = "3.0"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
regex-lite = { workspace = true }
rustc-hash = { workspace = true }
ustr = { workspace = true }
mimalloc = "0.1"
rayon = { workspace = true }
fs_extra = { workspace = true }
atomic_refcell = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
wait-timeout = { workspace = true }
sha2 = "0.10"
sysinfo = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = { workspace = true }
regex-lite = { workspace = true }
syn = { version = "2", features = ["full"] }
tempfile = "3.0"
test-utils = { workspace = true }
# web_smoke_tests: decode the headless-Chrome screenshot for the non-blank check.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[[bin]]
name = "rock-plain"
path = "src/main.rs"
