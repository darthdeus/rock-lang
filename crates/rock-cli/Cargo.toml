[package]
name = "rock-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "CLI library and standalone rock compiler"
autobins = false
autotests = false

[lib]
path = "src/lib.rs"

[features]
default = ["backend-js"]
# node execution of the JS-subset emitter (`rock --backend js`).
backend-js = ["dep:skull-codegen-js"]
# Shared Lua execution oracles for downstream compiler integration tests.
test-support = ["dep:test-utils"]
# Use sequential compiler passes for sampling without Rayon worker frames.
sequential = ["bone-semantic/sequential", "skull/sequential", "bone-query/sequential"]

[dependencies]
rock-engine-host = { path = "../rock-engine-host" }
rock-visual-bank = { path = "../rock-visual-bank" }
sound-core = { workspace = true }
globset = "0.4.19"
symphonia = { workspace = true }
rodio = { version = "0.22", default-features = false, features = ["mp3", "vorbis", "wav"] }

test-utils = { workspace = true, optional = true }
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
rock-log = { workspace = true }
rock-core = { workspace = true }
rock-tokenizer = { workspace = true }
skull-fmt = { workspace = true }
skull-parser = { workspace = true }
bone-semantic = { workspace = true }
bone-core = { workspace = true }
bone-lints = { workspace = true }
bone-incremental = { workspace = true }
bone-query = { workspace = true }
rock-lsp = { workspace = true }
skull = { workspace = true }
skull-codegen-glsl = { workspace = true }
skull-codegen-js = { workspace = true, optional = true }
skull-mir = { workspace = true }
skull-codegen-lua = { workspace = true }
png = "0.18"
lsp-types = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1"
serde = { workspace = true, features = ["derive"] }
fs-err = { workspace = true }
walkdir = { workspace = true }
tempfile = "3.0"
rustc-hash = { workspace = true }
ustr = { workspace = true }
mimalloc = { version = "0.1", features = ["v2"] }
rayon = { workspace = true }
atomic_refcell = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
wait-timeout = { workspace = true }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sysinfo = { workspace = true }
libc = "0.2"

[dev-dependencies]
lsp-server = { workspace = true }
test-utils = { workspace = true }

# Cargo cannot combine workspace lint inheritance with this crate's check-cfg.
[lints.clippy]
disallowed_types = "deny"
collapsible_match = "allow"
collapsible_if = "allow"
to_string_trait_impl = "allow"
new_without_default = "allow"
single_match = "allow"
len_zero = "allow"
unused_enumerate_index = "allow"
inherent_to_string = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "allow"
manual_strip = "allow"
unnecessary_map_or = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bin]]
name = "rock"
path = "src/main.rs"

[[test]]
name = "rock_cli_tests"
path = "tests/main.rs"

[[test]]
name = "child_lifetime"
path = "tests/child_lifetime.rs"
harness = false

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "winnt", "handleapi", "processthreadsapi"] }

[[test]]
name = "stone_launch"
path = "tests/stone_launch.rs"
