[package]
name = "rock-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "CLI library and standalone rock compiler"
autobins = false
autotests = false

[lib]
path = "src/lib.rs"

[features]
default = ["backend-js"]
# node execution of the JS-subset emitter (`rock --backend js`).
backend-js = ["dep:skull-codegen-js"]
# Shared Lua execution oracles for downstream compiler integration tests.
test-support = ["dep:test-utils"]
# Use sequential compiler passes for sampling without Rayon worker frames.
sequential = ["bone-semantic/sequential", "skull/sequential", "bone-query/sequential"]

[dependencies]
test-utils = { workspace = true, optional = true }
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
rock-log = { workspace = true }
rock-core = { workspace = true }
rock-tokenizer = { workspace = true }
skull-fmt = { workspace = true }
skull-parser = { workspace = true }
bone-semantic = { workspace = true }
bone-core = { workspace = true }
bone-lints = { workspace = true }
bone-incremental = { workspace = true }
bone-query = { workspace = true }
rock-lsp = { workspace = true }
skull = { workspace = true }
skull-codegen-glsl = { workspace = true }
skull-codegen-js = { workspace = true, optional = true }
skull-mir = { workspace = true }
lsp-types = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
fs-err = { workspace = true }
walkdir = { workspace = true }
tempfile = "3.0"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
regex-lite = { workspace = true }
rustc-hash = { workspace = true }
ustr = { workspace = true }
mimalloc = "0.1"
rayon = { workspace = true }
fs_extra = { workspace = true }
atomic_refcell = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
wait-timeout = { workspace = true }
sha2 = "0.10"
sysinfo = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
skull-codegen-shader = { workspace = true }
test-utils = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "rock"
path = "src/main.rs"
# The unit tests live in the library; integration tests still get the binary.
test = false

[[test]]
name = "rock_cli_tests"
path = "tests/main.rs"

[[test]]
name = "child_lifetime"
path = "tests/child_lifetime.rs"
harness = false
