# rock-host: neutral CLI/runtime substrate shared by every backend
# (rock=legacy, bone=typechecker, skull=codegen). A leaf crate by design —
# it must NOT depend on rock-semantic / rock-codegen / rock, so the "new"
# bone/skull path can use it without dragging in the legacy compiler.
[package]
name = "rock-host"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Load project source files serially instead of via rayon, so a sampling
# profile of the front end carries no rayon pool init/teardown frames.
# Mirrors rock-semantic's `sequential` feature.
sequential = []

[dev-dependencies]
test-utils = { path = "../test-utils" }

[dependencies]
rock-core = { path = "../rock-core" }
anyhow = { workspace = true }
fs-err = { workspace = true }
wait-timeout = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
basic-toml = "0.1"
sha1 = "0.10"
walkdir = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
sysinfo = { workspace = true }
tempfile = "3.0"
ustr = { workspace = true }
atomic_refcell = { workspace = true }
rayon = { workspace = true }
