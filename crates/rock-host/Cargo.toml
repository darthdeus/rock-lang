# rock-host: neutral CLI/runtime substrate shared by every backend
# (bone=typechecker, skull=codegen). A leaf crate by design: it must NOT
# depend on the compiler crates, so bone and skull can use it.
[package]
name = "rock-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "Project discovery, source loading, manifest configuration and compiler process support"

[lints]
workspace = true

[dev-dependencies]
test-utils = { workspace = true }

[dependencies]
rock-core = { workspace = true }
rock-stdlib = { workspace = true }
anyhow = { workspace = true }
fs-err = { workspace = true }
serde = { workspace = true, features = ["derive"] }
basic-toml = "0.1"
walkdir = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
sysinfo = { workspace = true }
tempfile = "3.0"
ustr = { workspace = true }
atomic_refcell = { workspace = true }
rayon = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wait-timeout = { workspace = true }
