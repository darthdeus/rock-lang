[package]
name = "rock-lsp"
version = "0.1.0"
edition = "2024"
repository.workspace = true
publish = false
description = "Language server, diagnostics and editor queries"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Mirror rock-cli: build rock-lsp's bone hover/diagnostics path with bone's
# sequential shim (single-threaded, no rayon frames) for clean profiling.
sequential = ["bone-query/sequential"]

[lints]
workspace = true

[dependencies]
bone-core = { workspace = true }
rock-host = { workspace = true }
bone-query = { workspace = true }
bone-lints = { workspace = true }
skull-parser = { workspace = true }

anyhow = { workspace = true }
fs-err = { workspace = true }
clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

ustr = { workspace = true }
log = { workspace = true }
rock-log = { workspace = true }

lsp-server = { workspace = true }
lsp-types = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

# Grouped integration-test binaries. Each tests/<group>/main.rs is one
# linked binary that `mod`-includes its sibling test files.
[[test]]
name = "bone"
path = "tests/bone/main.rs"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm = "0.28"
