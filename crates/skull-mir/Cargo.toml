[package]
autotests = false
name = "skull-mir"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "Cell-based control-flow IR, lowering and backend layout contracts"

# skull-mir: the cell-model CFG IR + HIR->CFG lowering for skull. Variables
# are mutable cells, expression results are single-use values, an
# instruction's `Idx<Inst>` IS its value, and control flow lives only in block
# terminators. NO SSA, NO block params. Transforms live in `skull-transform`,
# codegen in `skull-codegen-*`.

[dependencies]
bone-core = { workspace = true }
comfy-la-arena = { workspace = true }
rustc-hash = { workspace = true }
skull-parser = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
bone-semantic = { workspace = true }
ustr = { workspace = true }
# Source of the real stdlib (`__op_*` overloads etc.) so arithmetic snippets
# resolve in lowering tests, exactly as the real corpus loads it.
rock-stdlib = { workspace = true }
skull-graph = { workspace = true }

[lints]
workspace = true

[[test]]
name = "skull_mir_tests"
path = "tests/main.rs"
