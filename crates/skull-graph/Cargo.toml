[package]
name = "skull-graph"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
publish = false
description = "Backend-neutral instance graph and concrete artifact plans"

[features]
sequential = []

# The TARGET-NEUTRAL instance graph and the per-artifact views over it. It sits BELOW every backend so
# each one realizes the same graph: `skull` (luajit driver),
# `skull-codegen-js` and `skull-codegen-glsl` all depend on this crate, and it
# depends on none of them. Roots are an INPUT -- deciding what a build roots
# from is the driver's job, so `emission_roots` stays in `skull`.
[dependencies]
bone-core = { workspace = true }
bone-semantic = { workspace = true }
skull-mir = { workspace = true }
skull-parser = { workspace = true }
comfy-la-arena = { workspace = true }
ustr = { workspace = true }
rustc-hash = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }

[lints]
workspace = true
