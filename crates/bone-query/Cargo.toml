[package]
name = "bone-query"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "IDE queries, completion ranking and the LSP workspace facade"
autotests = false

# IDE/LSP query layer over bone's typed HIR: protocol-agnostic queries
# (`query`) plus the lsp_types-facing workspace facade (`backend`). bone stays
# the pure engine; this crate is the only place that knows about `lsp_types`.
[features]
# Forward bone's single-threaded shim for clean profiling (see single-threaded profiling).
sequential = ["bone-semantic/sequential"]

[dependencies]
bone-core = { workspace = true }
bone-semantic = { workspace = true }
bone-incremental = { path = "../bone-incremental" }
bone-lints = { workspace = true }
skull-parser = { workspace = true }
rock-tokenizer = { workspace = true }
rock-host = { workspace = true }
rock-stdlib = { workspace = true }
rock-core = { workspace = true }
lsp-types = { workspace = true }

rust-lapper = { workspace = true }
ustr = { workspace = true }
log = { workspace = true }
fs-err = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true

[[test]]
name = "bone_query_tests"
path = "tests/main.rs"
