[package]
name = "skull"
version = "0.1.0"
edition = "2024"
autotests = false

# skull is the Claude-managed code-generation backend for `bone`'s HIR. It
# consumes bone as a library (parse -> semantic_pass -> Workspace) and emits
# Lua, independent of rock's `rock-codegen`. See docs/skull-plan.md.

[features]
# Swap skull's and skull-graph's Rayon fanouts for sequential iteration, so a
# sampling profiler attributes codegen samples to one thread (clean flamegraphs).
# Mirrors bone's `sequential`. Wired through rock-cli's `sequential` feature.
sequential = ["skull-graph/sequential"]
renderer-wgpu = ["dep:skull-codegen-wgsl"]

[dependencies]
bone-semantic = { path = "../bone-semantic" }
skull-mir = { path = "../skull-mir" }
# The shared instance graph + artifact views, below every backend.
skull-graph = { path = "../skull-graph" }
skull-codegen-lua = { path = "../skull-codegen-lua" }
# Driver-layer GLSL emission for `rock_shader` top-level registration
# (docs/shaders.md). skull (the driver) may depend on the GLSL
# backend; skull-mir must not -- the layering constraint.
skull-codegen-glsl = { path = "../skull-codegen-glsl" }
skull-codegen-shader = { path = "../skull-codegen-shader" }
skull-codegen-wgsl = { path = "../skull-codegen-wgsl", optional = true }
skull-transform = { path = "../skull-transform" }
skull-parser = { path = "../skull-parser" }
comfy-la-arena = { workspace = true }
ustr = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
rock-host = { path = "../rock-host" }
skull-graph = { path = "../skull-graph", features = ["test-hooks"] }
tempfile = "3.0"
# The updater's tests drive real incremental inference rather than inventing a
# reinferred-body set: `UpdateResult::reinferred` is exactly the population
# `InstanceGraph::update_bodies` takes.
bone-incremental = { path = "../bone-incremental" }

[lints]
workspace = true

[[test]]
name = "skull_tests"
path = "tests/main.rs"

[[test]]
name = "skull_wgpu_tests"
path = "tests/main_wgpu.rs"
required-features = ["renderer-wgpu"]
