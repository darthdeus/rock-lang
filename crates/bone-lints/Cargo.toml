[package]
autotests = false
name = "bone-lints"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lint catalog, HIR analysis and incremental lint cache"
license.workspace = true
repository.workspace = true

# Unit tests in src/ run with the ordinary crate suite; no doctests are defined.
[lib]
doctest = false

[dependencies]
rock-host = { workspace = true }
bone-core = { workspace = true }
rock-core = { workspace = true }

[dev-dependencies]
bone-semantic = { workspace = true }
skull-parser = { workspace = true }

[lints]
workspace = true

[[test]]
name = "bone_lints_tests"
path = "tests/main.rs"
