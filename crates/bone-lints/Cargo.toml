[package]
autotests = false
name = "bone-lints"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lint catalog, HIR analysis and incremental lint cache"
license.workspace = true
repository.workspace = true

# No unit tests or doctests in src/; skip the empty test harness.
[lib]
test = false
doctest = false

[dependencies]
bone-core = { workspace = true }
rock-core = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
bone-semantic = { workspace = true }
skull-parser = { workspace = true }

[lints]
workspace = true

[[test]]
name = "bone_lints_tests"
path = "tests/main.rs"
