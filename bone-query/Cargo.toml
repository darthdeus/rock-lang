[package]
name = "bone-query"
version = "0.1.0"
edition = "2024"

# IDE/LSP query layer over bone's typed HIR: protocol-agnostic queries
# (`query`) plus the lsp_types-facing workspace facade (`backend`). bone stays
# the pure engine; this crate is the only place that knows about `lsp_types`.
[features]
# Forward bone's single-threaded shim for clean profiling (see docs/bone-profiling.md).
sequential = ["bone-semantic/sequential"]

[dependencies]
bone-semantic = { path = "../bone-semantic" }
bone-incremental = { path = "../bone-incremental" }
skull-parser = { path = "../skull-parser" }
rock-tokenizer = { path = "../crates/rock-tokenizer" }
rock-syntax = { path = "../rock-syntax" }
rock-host = { path = "../rock-host" }
lsp-types = { path = "../crates/lsp-types-manual", package = "lsp-types-manual" }

rust-lapper = { workspace = true }
ustr = { workspace = true }
log = { workspace = true }
fs-err = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
