name: CI

# Manual: run it from the Actions tab (workflow_dispatch). Changes are gated
# on the author's build hosts before they land.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # LuaJIT v2.1 at 2.1.1785763465.
  LUAJIT_SHA: 1edc3e52b67eaf6ce5f809be8e17d6862594b8bc

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config
      # Distro LuaJIT builds older than 2.1.1785763465 round some exact
      # ties in number formatting differently from the correctly rounded
      # result that the Lua and JS backends must agree on.
      - name: Cache LuaJIT
        id: luajit-cache
        uses: actions/cache@v4
        with:
          path: ~/luajit
          key: luajit-${{ runner.os }}-${{ env.LUAJIT_SHA }}
      - name: Build LuaJIT
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/luajit-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/LuaJIT/LuaJIT.git "$LUAJIT_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          make -C "$src" -j"$(nproc)" PREFIX="$HOME/luajit"
          make -C "$src" install PREFIX="$HOME/luajit"
      - name: Put LuaJIT on PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/luajit/bin" >> "$GITHUB_PATH"
          "$HOME/luajit/bin/luajit" -v
      - name: Check public content
        shell: bash
        env:
          ROCK_LANG_DENYLIST: ${{ secrets.ROCK_LANG_DENYLIST }}
        run: |
          mkdir -p "$HOME/.config/rock-lang"
          printf '%s\n' "$ROCK_LANG_DENYLIST" > "$HOME/.config/rock-lang/denylist"
          test -n "$ROCK_LANG_DENYLIST" || { echo "ROCK_LANG_DENYLIST secret is not set" >&2; exit 1; }
          git grep -I -h . -- . > "$RUNNER_TEMP/public-content.txt"
          .githooks/check-public "$RUNNER_TEMP/public-content.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Show LuaJIT
        run: command -v luajit && luajit -v
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test language corpus
        run: cargo run --locked -p rock-cli --bin rock -- test tests/
      - name: Test language corpus on the JS backend
        # A test the JS backend cannot compile is skipped, not failed. Cap the
        # skip count so new skips need an explicit bump; lower it as the
        # emitter catches up.
        env:
          JS_MAX_SKIPS: "158"
        run: |
          set -o pipefail
          cargo run --locked -p rock-cli --bin rock -- test --backend js tests/ | tee "$RUNNER_TEMP/js-corpus.txt"
          skipped=$(sed -n 's/^js backend: .*, \([0-9][0-9]*\) skipped).*/\1/p' "$RUNNER_TEMP/js-corpus.txt")
          if [ -z "$skipped" ]; then
            echo "could not read the JS skip count"
            exit 1
          fi
          if [ "$skipped" -gt "$JS_MAX_SKIPS" ]; then
            echo "JS corpus skips rose to $skipped (cap $JS_MAX_SKIPS)"
            exit 1
          fi
          if [ "$skipped" -lt "$JS_MAX_SKIPS" ]; then
            echo "JS corpus skips fell to $skipped; lower JS_MAX_SKIPS to $skipped"
          fi
      - name: Test diagnostic and CLI output with forced colors
        env:
          ROCK_FORCE_COLOR: "1"
          ROCK_LOG_COLOR: always
          CLICOLOR_FORCE: "1"
          FORCE_COLOR: "1"
        run: cargo test --locked -p rock-core -p rock-cli -p rock-log
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check wasm libraries
        run: cargo check --locked --lib --target wasm32-unknown-unknown -p skull-fmt -p skull -p skull-codegen-glsl -p rock-stdlib -p bone-incremental -p bone-lints -p rock-lsp -p rock-wasm
      - name: Build the playground (wasm module and stdlib)
        run: playground/build.sh
      - name: Wasm smoke test against native output
        run: node crates/rock-wasm/tests/smoke.mjs playground/dist/rock_wasm.wasm target/debug/rock
      - name: Wasm language server test
        run: node crates/rock-wasm/tests/lsp.mjs playground/dist/rock_wasm.wasm
      - name: Playground worker smoke test
        run: node playground/smoke.mjs
