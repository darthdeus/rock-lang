[package]
name = "rock-cli"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rock"
path = "src/main.rs"

[features]
# Build the `rock` binary with bone's parallel passes swapped for sequential
# std-iterator equivalents (the prelude shim in bone/src/prelude.rs), for clean
# single-threaded sampling profiles with no rayon plumbing frames. rock-cli is a
# workspace default-member, so `cargo {build,run} --features sequential` resolves
# this and propagates it to bone. It also flips rock-semantic's source loading
# to serial, so a front-end profile (rock iter-parse / iter-tokenize) has no
# rayon pool/teardown frames either. See `just samply-bone-seq`.
sequential = ["bone-semantic/sequential", "skull/sequential", "bone-query/sequential", "rock-lsp/sequential"]

[dependencies]
rock-host = { path = "../rock-host" }
rock-log = { path = "../rock-log" }
rock-types = { path = "../rock-types" }
skull-fmt = { path = "../crates/skull-fmt" }
rock-syntax = { path = "../rock-syntax" }
skull-parser = { path = "../skull-parser" }
bone-semantic = { path = "../bone-semantic" }
bone-incremental = { path = "../bone-incremental" }
bone-query = { path = "../bone-query" }
rock-lsp = { path = "../rock-lsp" }
skull = { path = "../skull" }
lsp-types = { path = "../crates/lsp-types-manual", package = "lsp-types-manual" }

clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
fs-err = { workspace = true }
walkdir = { workspace = true }
tempfile = "3.0"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
regex-lite = { workspace = true }
rustc-hash = { workspace = true }
ustr = { workspace = true }
mimalloc = "0.1"
rayon = { workspace = true }
fs_extra = { workspace = true }
atomic_refcell = { workspace = true }
log = { workspace = true }
png = "0.18"
parking_lot = { workspace = true }
wait-timeout = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "winnt", "handleapi", "processthreadsapi"] }

[dev-dependencies]
insta = { workspace = true }
regex-lite = { workspace = true }
tempfile = "3.0"

[lints]
workspace = true

[package.metadata.cargo-machete]
# `#[global_allocator]` decl in main.rs; cargo-machete's grep doesn't see it.
ignored = ["mimalloc"]
