[package]
name = "skull-mir"
version = "0.1.0"
edition = "2024"

# skull-mir: the cell-model CFG IR + HIR->CFG lowering for skull (the
# Claude-managed backend). A FAITHFUL realization of docs/bone-mir-design.md:
# variables are mutable cells, expression results are single-use values, an
# instruction's `Idx<Inst>` IS its value, and control flow lives only in block
# terminators. NO SSA, NO block params (that arrives later as an additive
# mem2reg pass). Transforms live in `skull-transform`, codegen in
# `skull-codegen-*`. Plan: docs/skull-bone-mir-faithful-plan.md.

[dependencies]
comfy-la-arena = { workspace = true }
bone-semantic = { path = "../bone-semantic" }
skull-parser = { path = "../skull-parser" }
ustr = { workspace = true }

[dev-dependencies]
ustr = { workspace = true }
# Source of the real stdlib (`__op_*` overloads etc.) so arithmetic snippets
# resolve in lowering tests, exactly as the real corpus loads it.
rock-host = { path = "../rock-host" }

[lints]
workspace = true
