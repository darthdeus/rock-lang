[workspace]
resolver = "2"
members = [
    "crates/rock-cli",
    "crates/skull",
    "crates/skull-codegen-shader",
    "crates/skull-codegen-glsl",
    "crates/stone-glsl-runner",
    "crates/skull-codegen-wgsl",
    "crates/skull-codegen-lua",
    "crates/skull-codegen-js",
    "crates/skull-transform",
    "crates/rock-lsp",

    "crates/skull-mir",
    "crates/skull-graph",
    "crates/bone-core",
    "crates/bone-incremental",
    "crates/bone-query",
    "crates/bone-inference",
    "crates/bone-lints",
    "crates/bone-lower",
    "crates/bone-semantic",
    "crates/la-arena",
    "crates/lsp-serde-test",
    "crates/lsp-server-manual",
    "crates/lsp-types-manual",
    "crates/rock-core",
    "crates/rock-host",
    "crates/rock-log",
    "crates/rock-stdlib",
    "crates/rock-wasm",
    "crates/rock-tokenizer",
    "crates/skull-fmt",
    "crates/skull-parser",
    "crates/skull-wgsl-abi",
    "crates/test-utils",
]

# Keep plain cargo build/test usable without the optional SDL2 runner.
# --workspace still includes every member, including the runner.
default-members = [
    "crates/rock-cli",
    "crates/skull",
    "crates/skull-codegen-shader",
    "crates/skull-codegen-glsl",
    "crates/skull-codegen-wgsl",
    "crates/skull-codegen-lua",
    "crates/skull-codegen-js",
    "crates/skull-transform",
    "crates/rock-lsp",
    "crates/skull-mir",
    "crates/skull-graph",
    "crates/bone-core",
    "crates/bone-incremental",
    "crates/bone-query",
    "crates/bone-inference",
    "crates/bone-lints",
    "crates/bone-lower",
    "crates/bone-semantic",
    "crates/la-arena",
    "crates/lsp-serde-test",
    "crates/lsp-server-manual",
    "crates/lsp-types-manual",
    "crates/rock-core",
    "crates/rock-host",
    "crates/rock-log",
    "crates/rock-stdlib",
    "crates/rock-wasm",
    "crates/rock-tokenizer",
    "crates/skull-fmt",
    "crates/skull-parser",
    "crates/skull-wgsl-abi",
    "crates/test-utils",
]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/darthdeus/rock-lang"

[workspace.dependencies]
clap_complete = "4.5"
fs_extra = "1.3.0"
notify = { version = "8.0.0", default-features = false }
notify-debouncer-full = { version = "0.5.0", default-features = false }
regex-lite = "0.1"
rock-log = { path = "crates/rock-log" }
skull-fmt = { path = "crates/skull-fmt" }
skull = { path = "crates/skull" }
skull-wgsl-abi = { path = "crates/skull-wgsl-abi" }
skull-codegen-shader = { path = "crates/skull-codegen-shader" }
skull-codegen-glsl = { path = "crates/skull-codegen-glsl" }
skull-codegen-wgsl = { path = "crates/skull-codegen-wgsl" }
skull-codegen-lua = { path = "crates/skull-codegen-lua" }
skull-codegen-js = { path = "crates/skull-codegen-js" }
skull-transform = { path = "crates/skull-transform" }
rock-lsp = { path = "crates/rock-lsp" }
lsp-server = { package = "lsp-server-manual", path = "crates/lsp-server-manual" }
env_filter = { version = "2.0.0", default-features = false, features = ["std"] }
tracing-flame = "0.2"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry"] }
tracing-perfetto = "0.1"
skull-mir = { path = "crates/skull-mir" }
skull-graph = { path = "crates/skull-graph" }
bone-incremental = { path = "crates/bone-incremental" }
bone-query = { path = "crates/bone-query" }
bone-lints = { path = "crates/bone-lints" }
rock-tokenizer = { path = "crates/rock-tokenizer" }
rock-stdlib = { path = "crates/rock-stdlib" }
comfy-la-arena = { path = "crates/la-arena" }
lsp-types = { package = "lsp-types-manual", path = "crates/lsp-types-manual" }
bone-core = { path = "crates/bone-core" }
bone-semantic = { path = "crates/bone-semantic" }
rock-core = { path = "crates/rock-core" }
rock-host = { path = "crates/rock-host" }
test-utils = { path = "crates/test-utils" }
wait-timeout = "0.2"
walkdir = "2.5.0"
parking_lot = "0.12"
sysinfo = { version = "0.35.2", default-features = false, features = ["system"] }
skull-parser = { path = "crates/skull-parser" }
anyhow = "1.0"
ariadne = "0.4.1"
atomic_refcell = "0.1.13"
colored = "2.0"
fs-err = "3.1"
itertools = "0.13.0"
nonmax = "0.5.5"
once_cell = "1.20"
ordered-float = { version = "5.0.0" }
rust-lapper = "1.1.0"
rustc-hash = "2.1.1"
smallvec = "1.15.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
ustr = "1.0.0"
clap = { version = "4.5.20", default-features = false, features = ["std", "help", "usage", "error-context"] }
log = "0.4.22"
rand = "0.9.3"
rayon = "1.10"
serde = { version = "1.0.219", default-features = false, features = ["std"] }
serde_json = "1.0"

[workspace.lints.clippy]
disallowed_types = "deny"
collapsible_match = "allow"
collapsible_if = "allow"
to_string_trait_impl = "allow"
new_without_default = "allow"
single_match = "allow"
len_zero = "allow"
unused_enumerate_index = "allow"
inherent_to_string = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
manual_strip = "allow"
unnecessary_map_or = "allow"

# The typechecker recurses deeply; unoptimized frames overflow the default
# test-thread stack on the larger fixtures.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# The browser playground's Wasm module (`--profile wasm-release`): small, no
# symbol names, and panics abort since the module traps on a panic anyway.
# opt-level "s" over "z": "z" saved a further 12% gzipped but compiled
# programs about 1.6x slower, and the page recompiles on every edit.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
