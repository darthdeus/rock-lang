[workspace]
resolver = "2"
members = [
    "crates/bone-core",
    "crates/bone-inference",
    "crates/bone-lower",
    "crates/bone-semantic",
    "crates/la-arena",
    "crates/lsp-serde-test",
    "crates/lsp-server-manual",
    "crates/lsp-types-manual",
    "crates/rock-core",
    "crates/rock-log",
    "crates/rock-stdlib",
    "crates/rock-tokenizer",
    "crates/skull-fmt",
    "crates/skull-parser",
    "crates/skull-wgsl-abi",
    "crates/test-utils",
]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/darthdeus/rock-lang"

[workspace.dependencies]
anyhow = "1.0"
ariadne = "0.4.1"
atomic_refcell = "0.1.13"
colored = "2.0"
fs-err = "3.1"
itertools = "0.13.0"
nonmax = "0.5.5"
once_cell = "1.20"
ordered-float = { version = "5.0.0" }
rust-lapper = "1.1.0"
rustc-hash = "2.1.1"
smallvec = "1.15.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
ustr = "1.0.0"
clap = { version = "4.5.20", default-features = false, features = ["std", "help", "usage", "error-context"] }
log = "0.4.22"
rand = "0.9.3"
rayon = "1.10"
serde = { version = "1.0.219", default-features = false, features = ["std"] }
serde_json = "1.0"

[workspace.lints.clippy]
collapsible_match = "allow"
collapsible_if = "allow"
to_string_trait_impl = "allow"
new_without_default = "allow"
single_match = "allow"
len_zero = "allow"
unused_enumerate_index = "allow"
inherent_to_string = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
manual_strip = "allow"
unnecessary_map_or = "allow"

# The typechecker recurses deeply; unoptimized frames overflow the default
# test-thread stack on the larger fixtures.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
